<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlbertStudy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>AlbertStudy</h1>
      <p class="subtitle">Turn your course notes into a quiz</p>
    </header>

    <section id="select-screen" class="screen">
      <label for="course-select">Course</label>
      <select id="course-select"></select>

      <button id="generate-btn" type="button">Generate quiz</button>
    </section>

    <section id="loading-screen" class="screen hidden">
      <div class="spinner" aria-hidden="true"></div>
      <p>Generating your quiz&hellip;</p>
    </section>

    <section id="error-screen" class="screen hidden">
      <p id="error-message" class="error-message"></p>
      <button id="retry-btn" type="button">Try again</button>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-progress">
        <span id="question-counter"></span>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <h2 id="question-text"></h2>
      <div id="options-list" class="options-list"></div>

      <div id="feedback" class="feedback hidden">
        <p id="feedback-text"></p>
        <p id="source-quote" class="source-quote"></p>
        <button id="next-btn" type="button">Next question</button>
      </div>
    </section>

    <section id="results-screen" class="screen hidden">
      <h2>Quiz complete</h2>
      <p id="score-text" class="score-text"></p>
      <button id="restart-btn" type="button">Try another course</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
